<!DOCTYPE html>
<html lang="en-US">
<head>
<style>
/* CSS based loader, see more examples here https://projects.lukehaas.me/css-loaders/ */
.loader,
.loader:before,
.loader:after {
  background: #6b6b6b;
  -webkit-animation: load1 1s infinite ease-in-out;
  animation: load1 1s infinite ease-in-out;
  width: 1em;
  height: 4em;
}
.loader {
  color: #6b6b6b;
  text-indent: -9999em;
  margin: 88px auto;
  position: relative;
  font-size: 11px;
  -webkit-transform: translateZ(0);
  -ms-transform: translateZ(0);
  transform: translateZ(0);
  -webkit-animation-delay: -0.16s;
  animation-delay: -0.16s;
}
.loader:before,
.loader:after {
  position: absolute;
  top: 0;
  content: "";
}
.loader:before {
  left: -1.5em;
  -webkit-animation-delay: -0.32s;
  animation-delay: -0.32s;
}
.loader:after {
  left: 1.5em;
}
@-webkit-keyframes load1 {
  0%,
  80%,
  100% {
    box-shadow: 0 0;
    height: 4em;
  }
  40% {
    box-shadow: 0 -2em;
    height: 5em;
  }
}
@keyframes load1 {
  0%,
  80%,
  100% {
    box-shadow: 0 0;
    height: 4em;
  }
  40% {
    box-shadow: 0 -2em;
    height: 5em;
  }
}
</style>
</head>
<body>
  <h1>Faithful Python Shiny App</h1>
  <p>
    This page loads the Shiny app as part of an iframe.
    The original app is deployed to
    <a href="https://h10y.shinyapps.io/faithful-py/" target="_blank"
    >https://h10y.shinyapps.io/faithful-py/</a>.
    Note: apps need to run securely over HTTPS for the browser to load it
    through an iframe.
  </p>
  <div>
    <div id="loader" class="text-center">
      <div class="loader"></div>
    </div>
    <iframe
      title="Faithful Python Shiny App"
      onload="document.getElementById('loader').style.display='none';"
      style="width:80%; height:500px;"
      frameborder="1"
      src="https://h10y.shinyapps.io/faithful-py/"
    >
      Your browser doesn't support iframes
    </iframe>
  </div>
</body>
</html>
